<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Пинг-понг в ЖК | Найти партнёра</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0b2b1f 0%, #1a4d2e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        .card {
            background: white;
            border-radius: 40px;
            padding: 40px 24px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 45px rgba(0,0,0,0.3);
        }

        /* эмодзи-мяч */
        .ball {
            font-size: 70px;
            display: block;
            margin-bottom: 16px;
        }

        /* заголовок */
        h1 {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #1e6b3b, #d4a017);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 20px;
        }

        /* текст приветствия */
        .greeting {
            font-size: 18px;
            line-height: 1.45;
            color: #2c3e2b;
            background: #f0f7e6;
            padding: 18px;
            border-radius: 28px;
            margin-bottom: 32px;
            font-weight: 500;
        }

        /* контейнер для кнопок */
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* общий стиль кнопок */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 20px;
            border-radius: 60px;
            font-size: 20px;
            font-weight: bold;
            text-decoration: none;
            transition: transform 0.15s, opacity 0.15s;
            border: none;
            cursor: pointer;
        }

        .btn:active {
            transform: scale(0.97);
        }

        /* телеграм */
        .btn-tg {
            background: #26A5E4;
            color: white;
            box-shadow: 0 6px 0 #1a6e9b;
        }

        /* вконтакте */
        .btn-vk {
            background: #0077FF;
            color: white;
            box-shadow: 0 6px 0 #0055b3;
        }

        .btn span:first-child {
            font-size: 28px;
        }

        /* мелкий текст под кнопками */
        .hint {
            margin-top: 28px;
            font-size: 13px;
            color: #6e8b6a;
            background: #eef4ea;
            display: inline-block;
            padding: 8px 16px;
            border-radius: 50px;
        }

        /* для очень маленьких телефонов (320px) */
        @media (max-width: 450px) {
            .card {
                padding: 30px 18px;
            }
            .greeting {
                font-size: 16px;
                padding: 14px;
            }
            .btn {
                padding: 14px 16px;
                font-size: 18px;
            }
            .btn span:first-child {
                font-size: 24px;
            }
            h1 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>

<div class="card">
    <span class="ball">🏓</span>
    <h1>Настольный теннис<br>в нашем ЖК</h1>

    <div class="greeting">
        👋 Привет, сосед!<br>
        Создал чат для нашего ЖК,<br>
        чтобы было с кем поиграть<br>
        в пинг-понг.<br>
        Присоединяйся!
    </div>

    <div class="buttons">
        <!-- ⚠️ ЗАМЕНИ ССЫЛКИ НА ТВОИ РЕАЛЬНЫЕ -->
        <a href="https://t.me/+g692ceqtNAk0ODgy" class="btn btn-tg" target="_blank" rel="noopener noreferrer">
            <span>📱</span> <span>Telegram</span>
        </a>

        <a href="https://max.ru/join/8G2YQeMoYsJm-heTs00LtAGmZ560_pfscj9INNUuUU0" class="btn btn-vk" target="_blank" rel="noopener noreferrer">
            <span>📘</span> <span>МАХ</span>
        </a>
        <!-- ↑↑↑ ЗАМЕНИ ССЫЛКИ ↑↑↑ -->
    </div>

    <div class="hint">
        🏓 Жми на кнопку → переходи в чат → договаривайся об игре
    </div>
</div>

</body>
</html>
